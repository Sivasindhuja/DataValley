version: '3.8'
# Production: Postgres + Redis + Chroma (single vector store, no Qdrant)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/support}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - ENABLE_MCP=${ENABLE_MCP:-false}
      - MCP_EXECUTION_MODE=${MCP_EXECUTION_MODE:-direct}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-please-use-env}
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  redis_data:
